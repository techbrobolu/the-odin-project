<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script defer src="index.js"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
		<title>T.O.P | Calaculator</title>
	</head>
	<body>
		<div class="calc-body">
			<div class="calc-display">
				<div class="working">5+5</div>
				<div class="result">10</div>
			</div>
			<div class="calc-buttons">
                <div class="calc-button ac">AC</div>
                <div class="calc-button del">DEL</div>
				<div class="calc-button divide">/</div>
				<div class="calc-button multiply">×</div>
				<div class="calc-button one">1</div>
				<div class="calc-button two">2</div>
				<div class="calc-button three">3</div>
				<div class="calc-button subtract">-</div>
				<div class="calc-button four">4</div>
				<div class="calc-button five">5</div>
				<div class="calc-button six">6</div>
				<div class="calc-button plus">+</div>
				<div class="calc-button seven">7</div>
				<div class="calc-button eight">8</div>
				<div class="calc-button nine">9</div>
				<div class="calc-button zero">0</div>
				<div class="calc-button dot">.</div>
				<div class="calc-button equal">=</div>
			</div>
		</div>
	</body>
</html>
