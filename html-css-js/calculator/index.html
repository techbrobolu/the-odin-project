<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>T.O.P | Calaculator</title>
</head>
<body>
    <div class="calc-body">
        <div class="calc-display">
            <div class="working">5+5</div>
            <div class="result">10</div>
        </div>
        <div class="calc-buttons">
            <div class="calc-button 1">1</div>
            <div class="calc-button 2">2</div>
            <div class="calc-button 3">3</div>
            <div class="calc-button divide">/</div>
            <div class="calc-button 4">4</div>
            <div class="calc-button 5">5</div>
            <div class="calc-button 6">6</div>
            <div class="calc-button multiply">×</div>
            <div class="calc-button 7">7</div>
            <div class="calc-button 8">8</div>
            <div class="calc-button 9">9</div>
            <div class="calc-button subtract">-</div>
            <div class="calc-button 10">0</div>
            <div class="calc-button dot">.</div>
            <div class="calc-button equal">=</div>
            <div class="calc-button plus">+</div>
        </div>
    </div>
</body>
</html>
