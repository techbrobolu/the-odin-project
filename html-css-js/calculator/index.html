<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script defer src="index.js"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="style.css" />
		<title>T.O.P | Calculator</title>
	</head>
	<body>
		<div class="calc-body">
			<div class="calc-display">
				<div class="working">5+5</div>
				<div class="result">10</div>
			</div>
			<div class="calc-buttons">
                <div class="calc-button ac" data-value="ac">AC</div>
                <div class="calc-button del" data-value="del">DEL</div>
				<div class="calc-button operator" data-value="/">/</div>
				<div class="calc-button operator" data-value="×">×</div>
				<div class="calc-button num-btn" data-value="1">1</div>
				<div class="calc-button num-btn" data-value="2">2</div>
				<div class="calc-button num-btn" data-value="3">3</div>
				<div class="calc-button operator" data-value="-">-</div>
				<div class="calc-button num-btn" data-value="4">4</div>
				<div class="calc-button num-btn" data-value="5">5</div>
				<div class="calc-button num-btn" data-value="6">6</div>
				<div class="calc-button operator" data-value="+">+</div>
				<div class="calc-button num-btn" data-value="7">7</div>
				<div class="calc-button num-btn" data-value="8">8</div>
				<div class="calc-button num-btn" data-value="9">9</div>
				<div class="calc-button num-btn zero" data-value="0">0</div>
				<div class="calc-button dot" data-value=".">.</div>
				<div class="calc-button equal" data-value="=">=</div>
			</div>
		</div>
	</body>
</html>
