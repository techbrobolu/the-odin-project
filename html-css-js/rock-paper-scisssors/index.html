<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<script defer src="index.js"></script>
		<title>Rock Paper Scissors</title>
	</head>
	<body>
		<div class="wrapper">
			<!-- Display for choices and annoucements -->
			<div class="game-board">
				<div class="computer-choice choice">
					<p class="player-tag">Computer</p>
					<div class="computer-move move"><img class="choice-img" src="assets/rock-down.svg" alt=""></div>
				</div>
				<div class="announcement">Click the Start Button</div>
				<div class="human-choice choice">
					<p class="player-tag">Human</p>
					<div class="human-move move"><img class="choice-img" src="assets/scissors.svg" alt=""></div>
				</div>
			</div>

			<!-- Scoreboard and Game Control Buttons -->
			<div class="game-controls">
				<div class="score-board">
					Human: <span class="human-score">0</span> vs Computer: <span class="computer-score">0</span>
				</div>
				<div class="game-choices">
					<img class="game-choice rock" src="assets/rock-horizontal.png" alt="rock" />
					<img class="game-choice paper" src="assets/paper-horizontal.png" alt="paper" />
					<img class="game-choice scissors" src="assets/scissors-horizontal.png" alt="scissors" />
				</div>
				<div class="control-buttons">
                    <button class="start-btn">Start Game</button>
                    <button class="restart-btn disabled">Restart Game</button>
                </div>
			</div>
		</div>
	</body>
</html>
